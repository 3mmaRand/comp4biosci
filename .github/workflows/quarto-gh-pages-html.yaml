name: Quarto Publish (gh-pages)

on:
  # build and publish on every push to main
  push:
    branches: [main]
  # and allow a manual run from the Actions tab
  workflow_dispatch:

# if you push twice quickly, cancel the older build
concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # quarto publish pushes to the gh-pages branch, so it needs write access
    permissions:
      contents: write

    env:
      # lets renv/R packages fetch anything from GitHub without hitting rate limits
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # pinned to the version that built the book locally (1.9.38).
          # Change to "release" if you would rather always use the latest.
          version: 1.9.38
          # no tinytex: the book is HTML only

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # read the R version (4.6.0) from renv.lock
          r-version: renv
          # use Posit Public Package Manager binaries on Linux (much faster
          # than compiling from source) and make renv use them too
          use-public-rspm: true

      # System libraries needed at run time by packages in renv.lock
      # (ragg, textshaping, systemfonts, xml2, curl, openssl, gert ...)
      - name: Install system libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev libgit2-dev \
            cmake libuv1-dev libglpk-dev libglpk40 libfftw3-dev libx11-dev

      # Restores the packages in renv.lock and caches them between runs.
      # The right version of renv is bootstrapped via .Rprofile + renv/activate.R
      - name: Restore R packages with renv
        uses: r-lib/actions/setup-renv@v2

      # Renders the whole book (R code is executed) and pushes the result to
      # the root of the gh-pages branch
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
